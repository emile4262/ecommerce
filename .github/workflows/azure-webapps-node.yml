name: Deploy to Develop
concurrency:
  group: deploy-develop
  cancel-in-progress: true
on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  packages: write
  contents: read

jobs:
  build-and-deploy:
    uses: Everest-Develop-Center/devops/.github/workflows/deploy-docker.yaml@v1.6.3
    with:
      app_name: audit-interne-api
      image_tag: develop
      context: dockerhub
      deploy_stage: develop
      with_commit_image: true
      deploy_port: 3060
      dns_name: audit-api.dev-team-everest.xyz
        
    secrets:
      registry: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_password: ${{ secrets.DOCKERHUB_TOKEN }}
      ssh_key: ${{ secrets.EVE_DEV_PRIVATE_KEY }}
      ssh_user: ${{ secrets.EVE_DEV_USER }}
      ssh_host: ${{ secrets.EVE_DEV_SERVER }}
      ssh_port: ${{ secrets.EVE_DEV_SSH_PORT }}
      deploy_env: ${{ secrets.DEV_ENV }}
      deploy_network: eve-pg-net
